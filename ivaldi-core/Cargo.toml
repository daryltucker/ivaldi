# ivaldi-core
#
# PURPOSE:
#   Core library containing types, traits, and business logic for ivaldi-mcp.
#   This crate is agnostic to interface (CLI or MCP) - pure logic only.
#
# ARCHITECTURE:
#   response.rs  → IvaldiResponse, AdvisoryMessage, ErrorDetail
#   file_ops.rs  → Find, list, read, create, write, edit, delete
#   ast_edit.rs  → AST-based editing via vecq integration
#   undo.rs      → Operation journal and undo stack
#   aiignore.rs  → .aiignore parsing and matching
#
# PHILOSOPHY:
#   - All operations return IvaldiResponse (never raw data)
#   - Advisory channel populated when relevant
#   - Pre-flight validation before writes
#   - Operations are journaled for undo
#
# KEY TYPES:
#   IvaldiResponse<T>  → Result wrapper with advisory channel
#   AdvisoryMessage    → Source (tool/server/adt), level, message, action
#   FileTarget         → Path or AST node reference
#   Operation          → Journaled operation for undo
#
# See: docs/PHILOSOPHY.md (Section 4: Third Channel)

