# ivaldi-mcp Workspace
#
# PURPOSE:
#   Modular MCP server for precision file operations.
#   Three crates: core (logic), cli (interface), server (MCP).
#
# ARCHITECTURE:
#   ivaldi-core   → Types, traits, file operations, AST editing
#   ivaldi-cli    → Human-facing command-line interface  
#   ivaldi-server → MCP JSON-RPC server for agents
#
# PHILOSOPHY:
#   - AST-first editing (no line number guessing)
#   - Third Channel (advisory output for coaching)
#   - Pre-flight validation (check before write)
#   - Undo stack (every operation reversible)
#
# See: docs/PHILOSOPHY.md, docs/planning/ROADMAP.md

[workspace]
resolver = "2"
members = [
    "ivaldi-core",
    "ivaldi-cli", 
    "ivaldi-server",
]

[workspace.package]
version = "1.0.5"
edition = "2024"
authors = ["Daryl Tucker"]
license = "MIT"
repository = "https://github.com/daryltucker/ivaldi"

[workspace.dependencies]
# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
schemars = "0.8.22"

# Error handling
anyhow = "1.0.102"
thiserror = "2.0.18"

# Async runtime
tokio = { version = "1.50.0", features = ["full"] }

# CLI
clap = { version = "4.5.60", features = ["derive"] }

# File system
walkdir = "2.5"
glob = "0.3.3"
ignore = "0.4.25"  # .gitignore/.aiignore parsing

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# Internal
ivaldi-core = { path = "ivaldi-core" } # Correct for local member
vecdb-common = { git = "https://github.com/daryltucker/vecdb", tag = "v1.0.4" }
vecq = { git = "https://github.com/daryltucker/vecdb", tag = "v1.0.4" }

[workspace.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ivaldi-{ target }.tar.gz"
pkg-fmt = "tgz"

[workspace.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/ivaldi-{ target }.zip"
pkg-fmt = "zip"
