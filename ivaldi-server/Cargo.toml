# ivaldi-server
#
# PURPOSE:
#   MCP (Model Context Protocol) server for AI Agent file operations.
#   This is the primary interface for Agents interacting with ivaldi.
#
# ARCHITECTURE:
#   main.rs      → Entry point, server initialization
#   handler.rs   → JSON-RPC request handling
#   tools/       → MCP tool implementations
#   resources/   → MCP resource exposure
#
# PHILOSOPHY:
#   - Agent-first design (JSON everywhere)
#   - Third Channel integrated (advisory in responses)
#   - Pre-flight validation on all writes
#   - ADT integration for prophetic errors
#
# MCP TOOLS EXPOSED (Planned):
#   - find_files, list_dir, read_file
#   - create_file, write_file, edit_file
#   - run_command (whitelisted)
#   - undo, history
#
# THE THIRD CHANNEL:
#   Every MCP response includes the advisory array.
#   Agents can scan for warnings without full re-evaluation.
#
# See: docs/MAN_AGENT.md, docs/MCP_SERVER.md (once implemented)

[package]
name = "ivaldi-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository = "https://github.com/daryltucker/ivaldi"

[lib]
name = "ivaldi_server"
path = "src/lib.rs"

[[bin]]
name = "ivaldi-server"
path = "src/main.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs", "io-util", "process", "net"] }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
schemars = { workspace = true }
vecdb-common = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.12.3"
clap = { version = "4.5", features = ["derive"] }
tracing = { workspace = true, features = ["log"] }
thiserror = { workspace = true }

ivaldi-core = { path = "../ivaldi-core" }
reqwest = { version = "0.12", features = ["json"] }
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# MCP / JSON-RPC (future)
# Will need: jsonrpsee or similar

[build-dependencies]
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
vecq.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "net"] }
ivaldi-core.workspace = true

[dev-dependencies]
tempfile = "3.26.0"

# Linux-only: tracing-journald requires libsystemd (not available on macOS/Windows)
[target.'cfg(target_os = "linux")'.dependencies]
tracing-journald = "0.3"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ivaldi-{ target }.tar.gz"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/ivaldi-{ target }.zip"
pkg-fmt = "zip"
